# «Как будет» доски: судьба узлов, которые меняются, и новые узлы; остальные генератор берёт из project/board.yaml
# как «не меняется». Пишет основная сессия на описании изменения; на закрытии места новых узлов переносятся в
# project/board.yaml, файл удаляется. Файла нет — на доске ничего не меняется.
# Узел — ключ сервиса, external:<провайдер>, redis или folder:<путь>. Поля:
#   status — changes: у вызывающего в «Связях» появился или ушёл подраздел ### или #### (новый вызов, ушёл
#            вызов), хранилище или подключение; у вызываемого — к нему появилась или ушла линия. Правка полей
#            вызова (ожидание, повторы) и работа внутри сервиса — не повод;
#            new, gone, open (судьба узла — вопрос человеку);
#   why    — почему, одной фразой; у open — вопрос, у gone — почему уходит;
#   pos    — место [колонка, строка], если узел новый или переезжает;
#   у нового узла ещё title, sub (подпись), kind (вид из реестра), asis (какие узлы «как есть» он заменяет);
#   у нового сервиса ещё registry — его запись реестра, как она встанет в project/services.yaml на закрытии
#            (поля — шапка реестра). По ней мир «как будет» видит файлы сервиса до закрытия: фактов у него ещё
#            нет, там facts: [], а в реестре он стоит перед узлами из asis.
# Шаблон:
#   nodes:
#     web: {status: changes, why: зовёт orders ещё и за статусом заказа}
nodes: {}

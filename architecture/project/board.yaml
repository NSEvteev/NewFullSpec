# ═══ Раскладка доски ═══════════════════════════════════════════════════════════════════════════════
#
# Зачем файл. Доска — страница ASIS/01_service-map.html: вся система одной схемой, узлы и линии связей
# между ними. Здесь записано только одно — где стоит каждый узел. Какие бывают узлы и какие между ними
# линии, генератор берёт сам: из реестра сервисов, их описаний и настроек проекта.
#
# Кто и когда пишет. Решающий двигает узлы мышью на доске и нажимает «Скопировать раскладку»;
# Claude вставляет готовый блок nodes сюда целиком, заменяя старый. Узел без места генератор ставит
# на место по умолчанию и пишет предупреждение «не размещён», пока его не перетащат. Места узлов нового
# сервиса из описания изменения переносятся сюда сами на закрытии изменения (map.py clean-tobe).
# В новом проекте здесь «nodes: {}» — доска пустая, пока не появится первый сервис.
#
# ─── Формат ────────────────────────────────────────────────────────────────────────────────────────
#
# nodes:
#   <узел>: [колонка, строка]
#
# Колонка и строка — числа, можно дробные: 2.5 — между второй и третьей колонкой. Колонки удобно вести
# слева направо по пути запроса: человек → интерфейс → сервисы → приём данных → внешние провайдеры.
#
# Какие бывают узлы:
#   human                 — человек, который работает с системой;
#   <ключ сервиса>        — сервис из services.yaml; его своя база рисуется внутри его прямоугольника;
#   <общее хранилище>     — из stores в settings.yaml, например redis;
#   folder:<путь>         — папка с данными на диске. Путь — от корня репо (../соседний-репо/data)
#                           или от домашней папки (~/.config/app), через «/». Без букв дисков и полных
#                           путей: иначе клон репо в другую папку или на другую машину сломает доску;
#   external:<провайдер>  — внешний провайдер из external в settings.yaml.
# Ключ-папку удобно брать в одинарные кавычки.
#
# ─── Шаблон ────────────────────────────────────────────────────────────────────────────────────────
#
# nodes:
#   human:                     [0, 2]
#   web:                       [1, 2]
#   orders:                    [2, 2]
#   'folder:../shared-data':   [2, 3.5]
#   external:payments:         [3, 2]
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════════

nodes: {}

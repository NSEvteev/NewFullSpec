# ═══ Реестр сервисов карты ═════════════════════════════════════════════════════════════════════════
#
# Зачем файл. Здесь перечислено всё, из чего состоит система, — каждая часть, у которой на карте своя
# папка ASIS/<ключ>/ с описанием. Для простоты все они называются «сервис»: и программа в Docker,
# и интерфейс, и общий пакет, и программа командной строки. По реестру:
#   - генератор знает, какие папки сервисов должны быть, в каком порядке их показывать и какого они вида;
#   - скрипт фактов знает, где у сервиса код, как его запустить и что из него вынимать;
#   - проверки знают, куда должны вести ссылки на код у каждого сервиса.
#
# Кто и когда пишет. Claude — когда в системе появляется или уходит сервис: на закрытии изменения,
# которое его создало или убрало. До закрытия запись нового сервиса лежит в его узле new в
# TOBE/board.yaml (поле registry): по ней проверки «как будет» видят его файлы. В новом проекте файл начинается пустым (одни комментарии) —
# карта при этом собирается, доска пустая; первый сервис приходит первым изменением.
#
# Порядок записей — это порядок сервисов на всех страницах, в обзоре системы и в выводе find.py.
# Ставь по смыслу: от того, что видит человек (интерфейс), к тому, что работает внутри
# (сервисы данных, расчёта), и в конце — общие пакеты и библиотеки.
#
# ─── Поля записи ───────────────────────────────────────────────────────────────────────────────────
#
# <ключ>     Имя сервиса: латиница, цифры, дефис. Это же имя его папки на карте — ASIS/<ключ>/.
#            Берётся имя сервиса в compose; у сервиса без контейнера — путь к коду через дефис
#            (shared/auth → shared-auth). Нельзя: _processes, README.md, tasks.md, blocks.md, board.yaml —
#            эти имена заняты в папке «как будет».
#
# kind       Обязательно. Вид сервиса — какая это вещь по устройству:
#              service   — программа, которая постоянно работает и отвечает на запросы по сети;
#              frontend  — интерфейс в браузере: страницы для человека, сам только зовёт сервисы;
#              package   — общий пакет: его код другие сервисы подключают к себе, сам он не запущен;
#              cli       — программа командной строки: запускают командой в терминале;
#              library   — библиотека из соседнего репо: код живёт не здесь, описание — тонкое,
#                          со ссылками на её собственное описание;
#              ci        — задание CI (например, GitHub Actions), которое участвует в процессах системы.
#            От вида зависит, как сервис выглядит на доске и в списках, и чего от него ждут:
#            у package и library в описании обязателен раздел «Кто подключает».
#
# compose    Имя сервиса в compose-файле (путь к файлу — в settings.yaml, ключ compose).
#            Есть — сервис запускается контейнером: скрипт фактов возьмёт из compose порт, тома,
#            переменные окружения, проверку здоровья. Нет поля — не контейнер.
#
# root       Обязательно. Папка сервиса в коде, от корня репо: src/orders. Код в соседнем репо — через ../
#
# package    Обязательно. Папка, где лежит сам код, — обычно root или root/<имя пакета>.
#            Ссылки «Код:» в описании сервиса должны вести сюда: знание лежит у того, чей это код.
#
# openapi    Адрес живой схемы методов на этой машине: http://localhost:<порт>/openapi.json.
#            Нужен, если у сервиса есть методы по HTTP и он умеет отдавать схему (часть fastapi-openapi).
#
# tests      Обязательно. Папки тестов, от root: [tests] или [tests/unit, tests/integration]; тесты рядом с кодом —
#            папка кода. [] — тестов нет
#            или их считает часть без запуска (vitest).
#
# tests_skip Необязательно. Словами — почему тесты сервиса считаются, но не запускаются.
#
# facts      Обязательно. Какие части скрипта фактов работают у этого сервиса — по технологиям, из которых
#            он сделан. Каждая часть вынимает своё в .facts.json папки сервиса:
#              compose            — порт, тома, переменные, команда запуска, проверка здоровья;
#              fastapi-openapi    — методы, их обработчики в коде, поля запроса и ответа (FastAPI);
#              pydantic-settings  — настройки из классов BaseSettings и чтения os.environ: имена, умолчания, секрет ли;
#              vite-env           — переменные окружения, которые читает интерфейс на Vite (import.meta.env);
#              postgres           — своя база: таблицы, колонки, типы, число строк (живая база);
#              alembic            — миграции базы;
#              python-imports     — какие общие пакеты проекта импортирует код;
#              python-exports     — что пакет даёт наружу: имена из __all__ и их подписи;
#              pytest             — сколько тестов собрано и итог прогона;
#              vitest             — сколько тестов интерфейса (считает без запуска).
#            [] — сервис описан без фактов, одними md: проверки, которым нужны факты, для него молчат.
#            Поля нет совсем — ошибка: иначе забытое поле тихо выключило бы проверки.
#            Нужной технологии нет в списке — для неё пишется своя часть в tools/facts/.
#
# short      Обязательно. Короткое имя, 2–4 латинские буквы, своё у каждого сервиса. Стоит в номерах
#            описания изменения: правка c-<short>-…, задача k-<short>-…, тест t-<short>-….
#            Нужно, чтобы агенты, которые параллельно пишут разные сервисы, не выдали одинаковых номеров.
#            Пока идёт изменение, не меняется.
#
# ─── Шаблон записи ─────────────────────────────────────────────────────────────────────────────────
#
# orders:
#   kind: service
#   compose: orders
#   root: src/orders
#   package: src/orders/orders
#   openapi: http://localhost:8010/openapi.json
#   tests: [tests]
#   facts: [compose, fastapi-openapi, pydantic-settings, postgres, alembic, python-imports, pytest]
#   short: ord
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════════

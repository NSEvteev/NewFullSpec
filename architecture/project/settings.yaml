# ═══ Настройки проекта ═════════════════════════════════════════════════════════════════════════════
#
# Зачем файл. Всё, что генератор, проверки и скрипт фактов должны знать именно об этом проекте, — здесь,
# а не в их коде: часовой пояс, единицы колонок, слова, внешние провайдеры, служебные имена, где лежит
# compose и файлы с секретами. Поэтому папку tools/ можно перенести в другой проект как есть: меняется
# только этот файл. Ещё этот файл — корень карты: инструменты ищут папку, в которой лежит
# project/settings.yaml, поднимаясь от своего места.
#
# Кто и когда пишет. Первый раз — /new-project (kit.py init). Дальше Claude — по решению того, кто решает:
# новое правило проекта, новый внешний провайдер (на закрытии изменения, которое его добавило), новое
# имя проекта для проверки общего набора. После правки этого файла нужна полная сборка (build.py): от него
# зависят все страницы. Значения ниже — умолчания нового проекта: карта с ними собирается.
#
# Ключи — по порядку ниже. Обязательны все, кроме помеченных «Необязательно».
#
# ═══════════════════════════════════════════════════════════════════════════════════════════════════

# ─── title ─────────────────────────────────────────────────────────────────────────────────────────
# Имя проекта: стоит в заголовках страниц и в первой строке обзора системы.
title: Новый проект

# ─── decider ───────────────────────────────────────────────────────────────────────────────────────
# Кто решает в изменениях: тот, чьи слова стоят в решениях обложки «как будет» и к кому вопросы со
# статусом «открыто» и «предложено». to — как обратиться в надписи «Вопросы к …» (дательный падеж).
# Шаблон: decider: {name: Анна, to: Анне}
decider:
  name: владелец
  to: владельцу

# ─── timezone ──────────────────────────────────────────────────────────────────────────────────────
# Часовой пояс проекта, по которому люди понимают время (имя из базы часовых поясов: Europe/Moscow, UTC).
# Нужен там, где время показывается человеку и где поля времени объясняют «по местному времени / UTC».
timezone: UTC

# ─── units ─────────────────────────────────────────────────────────────────────────────────────────
# Единицы числовых колонок: у каждой числовой колонки таблицы и файла данных единица — одна из этих.
# Колонка без единицы или с единицей не из списка — ошибка проверки: перепутанная единица (доля вместо
# процентов) даёт ошибку в сто раз. Новая единица — сюда, словами, как её прочтёт человек.
units:
  - деньги
  - доля              # 0.001 — это 0,1 %
  - проценты          # 0.1 — это 0,1 %
  - штуки
  - дни
  - секунды
  - коэффициент
  - номер             # только номер по порядку
  - идентификатор     # числовой идентификатор записи или внешней системы

# ─── words ─────────────────────────────────────────────────────────────────────────────────────────
# Слова, которых в тексте карты не должно быть, и чем их заменить: «слово: замена».
# Слово — начало слова, регистр не важен: «раннер» ловит «раннера» и «раннеры». В обратных кавычках
# и в ссылках [[…]] не ищется — там имена из кода. Нашлось — предупреждение, сборка не останавливается.
words:
  раннер: запускатель
  слот: место, очередь
  семафор: ограничитель
  флаг: отметка, переключатель
  воркер: фоновая задача
  трассировк: место, где упало
  эндпоинт: метод, адрес
  хардкод: зашито в коде
  захардкож: зашито в коде
  фоллбэк: запасной вариант
  дебаг: отладка
  реквест: запрос
  респонс: ответ
  пейлоад: содержимое
  API: методы сервиса
  CLI: программа командной строки

# ─── qualifiers ────────────────────────────────────────────────────────────────────────────────────
# Слова, которым нужно уточнение в той же фразе: «слово: [уточнения]». Слово — начало слова, как в words.
# «Поток» без Redis, SSE или WebSocket в той же фразе — предупреждение: «поток» значит слишком разное
# («фоном», «параллельно» — так и пишется).
qualifiers:
  поток: [Redis, SSE, WebSocket]

# ─── service_names ─────────────────────────────────────────────────────────────────────────────────
# Служебное, которому раздел в справочнике сервиса не нужен: методы и колонки, которые есть почти
# у всех и значат одно и то же. Без этого списка проверка «на каждый метод и колонку — раздел» требовала
# бы десятки пустых разделов. Метод — ключом, как в фактах; колонка — именем, у любой таблицы;
# настройка — именем: переменные окружения запуска (интерпретатора, контейнера), которые код сервиса не читает.
service_names:
  methods:
    - GET /api/v1/health
    - GET /api/v1/ready
  columns:
    - id
    - created_at
    - updated_at
  settings:
    - PYTHONPATH
    - PYTHONDONTWRITEBYTECODE
    - PYTHONUNBUFFERED

# ─── external ──────────────────────────────────────────────────────────────────────────────────────
# Внешние провайдеры — системы вне проекта, к которым ходят сервисы. Ключ — как в «external:<ключ>»
# в описаниях и на доске; name — как писать на страницах; what — что берём у провайдера, одной фразой.
# Провайдер, которого здесь нет, в «Связях» сервиса — ошибка проверки.
# Шаблон:
#   external:
#     payments:
#       name: Платёжный шлюз
#       what: списание денег за заказ
external: {}

# ─── stores ────────────────────────────────────────────────────────────────────────────────────────
# Общие хранилища проекта, которые рисуются на доске своими узлами (не база одного сервиса):
# redis, очередь сообщений и подобное. [] — таких нет.
stores: []

# ─── secret_names ──────────────────────────────────────────────────────────────────────────────────
# По каким именам настройка считается секретом: её значение не пишется в факты и ищется в тексте карты.
# match — шаблоны имён (* — любые знаки, регистр не важен); except — шаблоны, которые всё-таки
# не секрет, хотя подходят под match (адрес, идентификатор, путь).
secret_names:
  match: ["*PASSWORD*", "*SECRET*", "*TOKEN*", "*PRIVATE*", "*_KEY", "KEY", "*API_KEY*", "*RSA*"]
  except: ["*_URL", "*_ID", "*_PATH", "*_DIR"]

# ─── secret_files ──────────────────────────────────────────────────────────────────────────────────
# Необязательно. Файлы со значениями секретов, от корня репо (* — любые знаки). По ним проверка
# при коммите ищет, не попало ли значение секрета в md карты. В CI этих файлов нет — там проверка
# ищет только по именам. Нет ключа — значения не проверяются.
secret_files: [.env, platform/docker/.env, "config/*/.env*"]

# ─── compose ───────────────────────────────────────────────────────────────────────────────────────
# Необязательно — только если сервисы запускаются через docker compose. Откуда скрипт фактов берёт
# порты, тома и переменные сервисов (у сервиса в services.yaml — поле compose), а /docker-up — что поднимать:
#   file    — compose-файл, от корня репо;
#   env     — файл переменных, который compose подставляет в ${…};
#   project — имя проекта compose: контейнеры называются <project>-<сервис>-1.
# Шаблон:
#   compose:
#     file: platform/docker/docker-compose.yml
#     env: platform/docker/.env
#     project: docker

# ─── ui ────────────────────────────────────────────────────────────────────────────────────────────
# Необязательно — только если есть интерфейс в браузере. Как devShot.py снимает его страницы:
#   origin        — адрес интерфейса на этой машине;
#   login_command — необязательно: команда, которая печатает значение для localStorage одной строкой,
#                   чтобы браузер вошёл; {role} — роль (user или admin). Пишет её сам проект, она не зашита в набор;
#   storage_key   — ключ localStorage, куда положить это значение;
#   sizes         — необязательно: ширины снимков по умолчанию.
# Шаблон:
#   ui:
#     origin: http://localhost:3000
#     login_command: python scripts/login_value.py --role {role}
#     storage_key: auth-store
#     sizes: [1920x1080, 2560x1440]

# ─── shared_paths ──────────────────────────────────────────────────────────────────────────────────
# Необязательно. Общие файлы репо, у которых нет сервиса-хозяина (запуск, CI, общие настройки): ссылка
# «Код:» на них из справочника любого сервиса — не «чужой код». Начало пути от корня репо; файл —
# целым именем. Нет ключа — общих путей нет.
# Шаблон: shared_paths: [deploy/, .github/, Makefile]
shared_paths: [platform/, config/, .github/, Makefile]

# ─── editor_url ────────────────────────────────────────────────────────────────────────────────────
# Как страница открывает ссылку на код в редакторе: {path} — полный путь файла (страница вычисляет его
# сама из своего места на диске), {line} — строка. Для VS Code — vscode://file/{path}:{line}.
editor_url: vscode://file/{path}:{line}

# ─── backlog ───────────────────────────────────────────────────────────────────────────────────────
# Необязательно. Папка бэклога — задачи и требования: CLAUDE.md со списком, на задачу promt-<тема>.md и
# папка <тема>/. Её ведёт backlog.py, map.py start берёт оттуда требования изменения. Путь от корня репо.
# Нет ключа — _backlog.
# Шаблон: backlog: _backlog
backlog: _backlog

# ─── process_groups ────────────────────────────────────────────────────────────────────────────────
# Группы процессов в порядке показа: в общем меню страниц «Процессы» — колонкой на группу. Группа
# процесса — поле «Группа:» в его md (ASIS/_processes/<процесс>.md); процесс без поля или с группой не
# из списка встаёт в «Прочие» с предупреждением. Пустой список — меню без групп.
# Шаблон: process_groups: [Заказы, Оплата, Система]
process_groups: []

# ─── statuses ──────────────────────────────────────────────────────────────────────────────────────
# Слова статусов правок и решений в описании изменения, от сильного к слабому. Последние два —
# вопросы к тому, кто решает: пока они есть, описание не показывается на «да». Первое слово — с его
# именем: kit.py init --status «решено Анной».
statuses:
  - решено владельцем
  - решено по рекомендации
  - предложено
  - открыто

# ─── own_names ─────────────────────────────────────────────────────────────────────────────────────
# Имена этого проекта, которых не должно быть в общем наборе (скиллы, инструменты, их шапки),
# потому что набор переезжает в другие проекты; проверяет kit.py check. Слово ищется подстрокой
# («заказ» ловит «заказа»), числа и имена короче 4 знаков — словом целиком. Регистр не важен.
# Шаблон: own_names: [склад, накладн, "8010"]
own_names: []

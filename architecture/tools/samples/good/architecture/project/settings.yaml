# Проверочная карта: настройки выдуманного магазина. Что значит каждый ключ — шапка project/settings.yaml
# настоящей карты. Здесь только то, что нужно этой маленькой карте; compose и файлов секретов нет.

title: Магазин

decider:
  name: владелец
  to: владельцу

timezone: Europe/Moscow

units:
  - доллары
  - штуки

words:
  воркер: фоновая задача
  эндпоинт: метод, адрес

qualifiers:
  поток: [Redis, SSE, WebSocket]

service_names:
  methods:
    - GET /api/v1/health
  columns:
    - id
    - created_at

external:
  payments:
    name: Платёжный шлюз
    what: списание денег за заказ

stores: []

secret_names:
  match: ["*_KEY", "*SECRET*", "*PASSWORD*", "*TOKEN*"]
  except: ["*_URL"]

editor_url: vscode://file/{path}:{line}

statuses:
  - решено владельцем
  - решено по рекомендации
  - предложено
  - открыто

own_names: []

# ─── process_groups ────────────────────────────────────────────────────────────────────────────────
# Группы процессов в порядке показа: в общем меню страниц «Процессы» — колонкой на группу. Группа
# процесса — поле «Группа:» в его md (ASIS/_processes/<процесс>.md); процесс без поля или с группой не
# из списка встаёт в «Прочие» с предупреждением. Пустой список — меню без групп.
# Шаблон: process_groups: [Заказы, Оплата, Система]
process_groups:
  - Заказы


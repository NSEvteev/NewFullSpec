# Состояние для where.py: старт ещё идёт: обложка есть, правок и блоков нет, у решения статус «открыто».
# Из чистой проверочной карты: remove — удалить (путь или шаблон), replace — замены (all: true — все
# вхождения по шаблону file), add — новые файлы; пути — от good/. Вывод — expect.txt рядом.
remove:
- architecture/TOBE/*/**/*.md
- architecture/TOBE/blocks.md
- architecture/TOBE/board.yaml
replace:
- file: _backlog/promt-payment-retry.md
  old: '(не согласовано) **Покупатель'
  new: '(открыто) **Покупатель'
